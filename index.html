<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsplash Image Search</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="top">
        <h1>Unsplash Image Search</h1>

        <div class="controls">
            <input type="search" id="search-input" placeholder="Search photos... (press / to focus)"
                aria-label="Search photos" autocomplete="off">

            <select id="method-select" aria-label="Request method">
                <option value="xhr">XHR</option>
                <option value="promise">fetch (promises)</option>
                <option value="async" selected>fetch (async/await)</option>
            </select>

            <button id="search-btn">Search</button>
        </div>

        <!-- Request inspector: shows what Postman would show -->
        <div id="request-info" class="request-info" aria-live="polite">
            Type a search and press Enter.
        </div>
    </header>

    <main>
        <p id="message" class="message" aria-live="polite"></p>
        <section id="results" class="grid" aria-label="Search results"></section>
        <div class="more">
            <button id="load-more" hidden>Load more</button>
        </div>
    </main>

    <!-- Lightbox (opened by clicking or pressing Enter on a photo) -->
    <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button id="lb-close" class="lb-btn lb-close" aria-label="Close">&times;</button>
        <button id="lb-prev" class="lb-btn lb-prev" aria-label="Previous photo">&#8249;</button>
        <figure>
            <img id="lb-img" alt="">
            <figcaption id="lb-caption"></figcaption>
        </figure>
        <button id="lb-next" class="lb-btn lb-next" aria-label="Next photo">&#8250;</button>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
